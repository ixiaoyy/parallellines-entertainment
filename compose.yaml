name: parallellines-entertainment

services:
  app:
    image: ghcr.io/agnaistic/agnaistic:fccee00f5f7628d150760c787c4be87e6b1a652c@sha256:3afcf7f92eac3bdb335bb4a85bb91a86fcad6a953b5eeceb2a722c62726af0c1
    platform: linux/amd64
    restart: unless-stopped
    # 仅由正式发布在服务器私有目录生成，不在本机创建真实凭据。
    env_file:
      - ./runtime/agnai.env
    environment:
      NODE_ENV: production
      SELF_HOST: "1"
      APP_HOST: 0.0.0.0
      PORT: "3001"
      DB_HOST: mongo
      DB_PORT: "27017"
      DB_NAME: parallellines_entertainment
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ASSET_FOLDER: /app/dist/assets
      # 上游首次创建管理员会将初始口令写入 info；该等级抑制这条日志。
      LOG_LEVEL: warn
    ports:
      - "127.0.0.1:13101:3001"
    volumes:
      - app-db:/app/db
      - app-assets:/app/assets
      - app-dist-assets:/app/dist/assets
      - app-extras:/app/extras
    networks:
      default: {}
      backend: {}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 这是隔离上限，不是容量保证；发布前仍须检查宿主可用内存。
    mem_limit: 1g
    cpus: "1.0"
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # 原生健康同时确认 app、MongoDB、Redis 的连接状态，不调用模型。
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('http');const r=http.get('http://127.0.0.1:3001/healthcheck',s=>{let b='';s.on('data',x=>{b+=x;if(b.length>65536)r.destroy();});s.on('error',()=>process.exit(1));s.on('end',()=>{try{const j=JSON.parse(b);process.exit(s.statusCode===200&&j.status===true&&j.db===true&&j.redis===true?0:1);}catch{process.exit(1);}});});r.setTimeout(5000,()=>r.destroy());r.on('error',()=>process.exit(1));
      interval: 20s
      timeout: 8s
      start_period: 90s
      retries: 6

  mongo:
    image: mongo:8@sha256:05b334b0a7a78fe913caac0cd2e1ecccf4da515d9a3a44be911b6ea3734c17cd
    platform: linux/amd64
    restart: unless-stopped
    # 只连接本项目私网；没有宿主端口，不共享任何既有数据库。
    networks:
      - backend
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    mem_limit: 1g
    cpus: "1.0"
    logging: *bounded_logs
    healthcheck:
      test: [CMD, mongosh, --quiet, --host, "127.0.0.1", --port, "27017", --eval, "quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)"]
      interval: 10s
      timeout: 8s
      start_period: 45s
      retries: 12

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    platform: linux/amd64
    restart: unless-stopped
    # 仅承担原生消息总线；聊天和账号持久化由 MongoDB 负责。
    command: [redis-server, --save, "", --appendonly, "no"]
    networks:
      - backend
    mem_limit: 128m
    cpus: "0.5"
    logging: *bounded_logs
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  default: {}
  backend:
    internal: true

volumes:
  mongo-data: {}
  mongo-config: {}
  app-db: {}
  app-assets: {}
  app-dist-assets: {}
  app-extras: {}
