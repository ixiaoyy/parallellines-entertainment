name: parallellines-entertainment

services:
  element:
    image: ghcr.io/element-hq/element-web:v1.12.35@sha256:406b48b80153818284a235fa3600b2a5b5b6b0aa0e4ef4896b36d8d3461352f3
    platform: linux/amd64
    restart: unless-stopped
    # 只指定本实例的 homeserver；主题、品牌、语言和验证流程沿用原生产品。
    volumes:
      - type: bind
        source: ./config/element.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:13101:80"
    networks:
      default: {}
    # 这是隔离上限，不是容量保证；实际资源须在生产发布前核对。
    mem_limit: 128m
    cpus: "0.5"
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  synapse:
    image: ghcr.io/element-hq/synapse:v1.165.0@sha256:673b4223c81a7634fd07d832b939a58f97081cfdaae7cdd2d1664cdcf7611b62
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    # 该目录须先由官方 generate 创建，再按运维契约合并公开配置和私有口令。
    volumes:
      - type: bind
        source: ./data/synapse
        target: /data
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:13102:8008"
    networks:
      default: {}
      backend: {}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1.0"
    logging: *bounded_logs

  postgres:
    image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      # Synapse 原生要求 UTF8 与 C locale，不使用不安全 locale 绕过配置。
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    secrets:
      - postgres-password
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    # 数据库只连接本项目私网，不映射宿主端口。
    networks:
      backend: {}
    mem_limit: 1g
    cpus: "1.0"
    logging: *bounded_logs
    healthcheck:
      test: [CMD, pg_isready, -U, synapse, -d, synapse]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

networks:
  default: {}
  backend:
    internal: true

secrets:
  postgres-password:
    file: ./runtime/postgres-password
